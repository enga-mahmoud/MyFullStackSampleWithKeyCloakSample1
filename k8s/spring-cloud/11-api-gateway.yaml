---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://config-server:8888/actuator/health 2>/dev/null | grep -q UP; do
                echo "Waiting for config-server..."; sleep 5;
              done
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://keycloak:8080/health/ready 2>/dev/null; do
                echo "Waiting for keycloak..."; sleep 5;
              done
      containers:
        - name: api-gateway
          image: myapp/api-gateway:1.0.0   # build: docker build -t myapp/api-gateway:1.0.0 ./api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_CLOUD_CONFIG_URI
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://configuser:$(CONFIG_SERVER_PASSWORD)@config-server:8888"
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: "http://keycloak:8080/realms/myapp-realm"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: myapp
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
