---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-user 5432; do
                echo "Waiting for postgres-user..."; sleep 3;
              done
        - name: wait-for-config-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://config-server:8888/actuator/health 2>/dev/null | grep -q UP; do
                echo "Waiting for config-server..."; sleep 5;
              done
      containers:
        - name: user-service
          image: myapp/user-service:1.0.0   # build: docker build -t myapp/user-service:1.0.0 ./user-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://configuser:$(CONFIG_SERVER_PASSWORD)@config-server:8888"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-user:5432/userdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: userservice
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: USER_DB_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: "http://keycloak:8080/realms/myapp-realm"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: LOKI_URL
              value: "http://loki:3100"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: myapp
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
