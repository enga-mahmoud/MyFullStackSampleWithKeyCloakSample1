# Apply everything with: kubectl apply -k k8s/
# This processes files in the correct order.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: myapp

resources:
  - 00-namespace.yaml
  - 01-secrets.yaml
  - configmaps/02-config-repo-cm.yaml
  - configmaps/03-infra-configs-cm.yaml
  - configmaps/04-keycloak-realm-cm.yaml
  - storage/05-pvcs.yaml
  - databases/06-postgres-keycloak.yaml
  - databases/07-postgres-user.yaml
  - databases/08-postgres-product.yaml
  - databases/09-postgres-order.yaml
  - auth/09-keycloak.yaml
  - spring-cloud/10-config-server.yaml
  - spring-cloud/11-api-gateway.yaml
  - microservices/12-user-service.yaml
  - microservices/13-product-service.yaml
  - microservices/14-order-service.yaml
  - observability/14-otel-collector.yaml
  - observability/15-prometheus.yaml
  - observability/16-loki.yaml
  - observability/17-tempo.yaml
  - observability/18-grafana.yaml
  - frontend/19-frontend.yaml
  - 20-ingress.yaml
