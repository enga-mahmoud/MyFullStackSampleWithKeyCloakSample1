{{- if .Values.podDisruptionBudget.enabled }}
# PodDisruptionBudgets ensure at least one pod of each critical service remains
# available during node upgrades, cluster maintenance, or voluntary evictions.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 6 }}

