{{- if .Values.autoscaling.enabled }}
# HorizontalPodAutoscalers for stateless services.
# Requires the GKE Metrics Server (enabled by default on GKE Standard and Autopilot).
# Verify metrics are available: kubectl top pods -n {{ .Release.Namespace }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: {{ .Values.autoscaling.microservices.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.microservices.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.microservices.cpuUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.microservices.memoryUtilization }}

