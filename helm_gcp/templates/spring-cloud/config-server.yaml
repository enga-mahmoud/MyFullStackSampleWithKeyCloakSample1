---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.configServer }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" (dict "component" "config-server" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" (dict "component" "config-server" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: config-server
          image: {{ include "myapp.image" (dict "service" "config-server" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: native
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: file:/config-repo
            - name: SPRING_SECURITY_USER_NAME
              value: configuser
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
          volumeMounts:
            - name: config-repo
              mountPath: /config-repo
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.configServer | nindent 12 }}

      volumes:
        - name: config-repo
          configMap:
            name: config-repo

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "myapp.selectorLabels" (dict "component" "config-server" "root" .) | nindent 4 }}
  ports:
    - port: 8888
      targetPort: 8888
