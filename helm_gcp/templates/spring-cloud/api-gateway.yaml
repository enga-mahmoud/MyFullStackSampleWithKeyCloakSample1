---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.apiGateway }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo waiting for config-server; sleep 5; done']
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://keycloak:8080/health/ready; do echo waiting for keycloak; sleep 5; done']

      containers:
        - name: api-gateway
          image: {{ include "myapp.image" (dict "service" "api-gateway" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
          env:
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{ include "myapp.configServerUri" . }}
            - name: KEYCLOAK_ISSUER_URI
              value: {{ include "myapp.keycloakIssuerUri" . }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.microservices | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: '{"default": "api-gateway-backend-config"}'
spec:
  type: NodePort
  selector:
    {{- include "myapp.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 4 }}
  ports:
    - port: 8090
      targetPort: 8090
