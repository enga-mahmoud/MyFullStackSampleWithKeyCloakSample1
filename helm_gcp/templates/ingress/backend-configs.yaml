# BackendConfig CRDs tell the Google Cloud HTTP(S) LB how to health-check each
# backend service. Without these, the LB uses the default probe (GET / on the
# node port) which returns 4xx for Spring Boot and Keycloak endpoints.
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /index.html
    port: 80
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api-gateway-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /actuator/health
    port: 8090
  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 60

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 5
    type: HTTP
    requestPath: /health/ready
    port: 8080
  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 60

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grafana-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/health
    port: 3000
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
