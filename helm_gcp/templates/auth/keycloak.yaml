---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.keycloak }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" (dict "component" "keycloak" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" (dict "component" "keycloak" "root" .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres-keycloak
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-keycloak 5432; do echo waiting for postgres-keycloak; sleep 3; done']

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.4
          args: ["start", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-keycloak:5432/{{ .Values.keycloak.db.name }}
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.db.user }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: KC_DB_PASSWORD
            - name: KC_HOSTNAME
              value: {{ .Values.domain.keycloak }}
            - name: KC_PROXY
              value: edge
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.keycloak | nindent 12 }}

      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: '{"default": "keycloak-backend-config"}'
spec:
  type: NodePort
  selector:
    {{- include "myapp.selectorLabels" (dict "component" "keycloak" "root" .) | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
