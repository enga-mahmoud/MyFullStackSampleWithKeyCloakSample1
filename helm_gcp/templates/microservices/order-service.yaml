---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.orderService }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" (dict "component" "order-service" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" (dict "component" "order-service" "root" .) | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-order 5432; do echo waiting for postgres-order; sleep 3; done']
        - name: wait-for-config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo waiting; sleep 5; done']
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://keycloak:8080/health/ready; do echo waiting for keycloak; sleep 5; done']

      containers:
        - name: order-service
          image: {{ include "myapp.image" (dict "service" "order-service" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8083
          env:
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{ include "myapp.configServerUri" . }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-order:5432/{{ .Values.databases.orderDb.name }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.databases.orderDb.user }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: ORDER_DB_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: {{ include "myapp.keycloakIssuerUri" . }}
            - name: KEYCLOAK_TOKEN_URI
              value: {{ include "myapp.keycloakTokenUri" . }}
            - name: ORDER_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: order-client-secret
                  key: ORDER_SERVICE_CLIENT_SECRET
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8082
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: LOKI_URL
              value: http://loki:3100
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.microservices | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "myapp.selectorLabels" (dict "component" "order-service" "root" .) | nindent 4 }}
  ports:
    - port: 8083
      targetPort: 8083
