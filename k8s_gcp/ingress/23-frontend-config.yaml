# FrontendConfig enables HTTP→HTTPS redirect at the Google Cloud LB level.
# Applied to the Ingress via the networking.gke.io/v1beta1.FrontendConfig annotation.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: myapp-frontend-config
  namespace: myapp
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
