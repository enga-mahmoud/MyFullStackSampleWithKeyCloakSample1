# GKE native Ingress — creates a Google Cloud HTTP(S) Load Balancer.
#
# Prerequisites:
#   1. Reserve static IP:  gcloud compute addresses create myapp-static-ip --global
#   2. Create DNS A records for APP_DOMAIN, KEYCLOAK_DOMAIN, GRAFANA_DOMAIN
#      all pointing to the static IP printed by:
#      gcloud compute addresses describe myapp-static-ip --global --format="get(address)"
#   3. Wait for ManagedCertificate to reach "Active" status before using HTTPS.
#
# Path routing:
#   APP_DOMAIN/         → frontend:80   (SPA, nginx handles all sub-routes)
#   APP_DOMAIN/api/*    → api-gateway:8090
#   KEYCLOAK_DOMAIN/    → keycloak:8080
#   GRAFANA_DOMAIN/     → grafana:3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  namespace: myapp
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "myapp-static-ip"
    networking.gke.io/managed-certificates: "myapp-cert"
    networking.gke.io/v1beta1.FrontendConfig: "myapp-frontend-config"
spec:
  rules:
    - host: APP_DOMAIN
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    - host: KEYCLOAK_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

    - host: GRAFANA_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
