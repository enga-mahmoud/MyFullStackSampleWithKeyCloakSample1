# IMPORTANT: All values are base64-encoded.
# Replace every value below with a strong random secret before applying to GCP.
# Generate: echo -n "your-password" | base64
#
# Production recommendation: use Google Secret Manager + External Secrets Operator
# instead of plain Kubernetes Secrets.
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: myapp
type: Opaque
data:
  # keycloak_db_pass
  KC_DB_PASSWORD: a2V5Y2xvYWtfZGJfcGFzcw==

---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: myapp
type: Opaque
data:
  # admin
  KEYCLOAK_ADMIN: YWRtaW4=
  # Admin@1234!
  KEYCLOAK_ADMIN_PASSWORD: QWRtaW5AMTIzNCE=

---
apiVersion: v1
kind: Secret
metadata:
  name: user-db-secret
  namespace: myapp
type: Opaque
data:
  # user_db_pass
  USER_DB_PASSWORD: dXNlcl9kYl9wYXNz

---
apiVersion: v1
kind: Secret
metadata:
  name: product-db-secret
  namespace: myapp
type: Opaque
data:
  # product_db_pass
  PRODUCT_DB_PASSWORD: cHJvZHVjdF9kYl9wYXNz

---
apiVersion: v1
kind: Secret
metadata:
  name: config-server-secret
  namespace: myapp
type: Opaque
data:
  # config_pass
  CONFIG_SERVER_PASSWORD: Y29uZmlnX3Bhc3M=

---
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: myapp
type: Opaque
data:
  # order_db_pass
  ORDER_DB_PASSWORD: b3JkZXJfZGJfcGFzcw==

