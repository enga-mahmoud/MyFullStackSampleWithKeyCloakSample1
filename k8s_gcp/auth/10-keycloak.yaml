# GCP-specific Keycloak configuration:
# - KC_HOSTNAME: set to the external GCP domain (used in JWT issuer + redirect URIs)
# - KC_PROXY: edge — Keycloak is behind the GCP HTTP(S) Load Balancer that terminates TLS
# - KC_HOSTNAME_STRICT: false — allows internal pod health checks on http://keycloak:8080
# - KC_HTTP_ENABLED: true — GCP LB communicates with Keycloak over plain HTTP internally
# - KC_HOSTNAME_STRICT_HTTPS: false — HTTPS is enforced at the LB, not at Keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-postgres-keycloak
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-keycloak 5432; do echo waiting for postgres-keycloak; sleep 3; done']

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.4
          args: ["start", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-keycloak:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: KC_DB_PASSWORD
            # Replace KEYCLOAK_DOMAIN with your actual domain, e.g. keycloak.example.com
            - name: KC_HOSTNAME
              value: KEYCLOAK_DOMAIN
            - name: KC_PROXY
              value: edge
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi

      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: myapp
  annotations:
    # GKE Ingress requires NodePort services as backends for the Google Cloud LB
    cloud.google.com/backend-config: '{"default": "keycloak-backend-config"}'
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
