# PodDisruptionBudgets ensure at least one pod of each critical service
# remains available during node upgrades, cluster maintenance, or voluntary evictions.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: myapp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway

