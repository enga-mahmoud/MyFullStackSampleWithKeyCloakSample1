# KEYCLOAK_ISSUER_URI uses the public HTTPS domain because GCP LB terminates TLS.
# The JWT iss claim will be https://KEYCLOAK_DOMAIN/realms/myapp-realm — this must match.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo waiting for config-server; sleep 5; done']
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://keycloak:8080/health/ready; do echo waiting for keycloak; sleep 5; done']

      containers:
        - name: api-gateway
          image: REGION-docker.pkg.dev/PROJECT_ID/myapp/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secret
                  key: CONFIG_SERVER_PASSWORD
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://configuser:$(CONFIG_SERVER_PASSWORD)@config-server:8888
            # JWT iss claim will be https://KEYCLOAK_DOMAIN/realms/myapp-realm
            - name: KEYCLOAK_ISSUER_URI
              value: https://KEYCLOAK_DOMAIN/realms/myapp-realm
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: myapp
  annotations:
    cloud.google.com/backend-config: '{"default": "api-gateway-backend-config"}'
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8090
      targetPort: 8090
