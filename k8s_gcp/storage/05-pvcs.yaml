# GKE storage class: standard-rwo (pd-standard, ReadWriteOnce)
# Use premium-rwo instead for SSD-backed volumes (higher IOPS, higher cost).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-keycloak-pvc
  namespace: myapp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 5Gi

